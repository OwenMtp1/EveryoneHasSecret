# Déploiement Render (Blueprint) : Dashboard → New → Blueprint → choisir ce dépôt.
# Comptes persistants : renseigner les variables Supabase (voir docs/SUPABASE.md) dans le tableau de bord.
services:
  - type: web
    name: everyone-has-a-secret
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # ── Comptes et données persistants (Supabase) : valeurs à saisir dans le tableau de bord Render ──
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Seulement pour un projet Supabase utilisant encore le « Legacy JWT secret » (sinon laisser vide)
      - key: SUPABASE_JWT_SECRET
        sync: false
